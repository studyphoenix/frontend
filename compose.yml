services:
  frontend:
    image: ghcr.io/janishutz/vue-dev-runner
    container_name: frontend
    restart: on-failure
    ports:
      - 8081:8081
    volumes:
      - .:/mnt
  backend:
    image: ghcr.io/studyphoenix/backend
    container_name: backend
    restart: on-failure
    ports:
      - 8080:8080
    environment:
      DATA_DIR: /data
      BACKEND_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8081
      DEFAULT_REDIRECT: http://localhost:8081
    volumes:
      - ./backend-data:/data
